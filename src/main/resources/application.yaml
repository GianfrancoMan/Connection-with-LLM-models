spring:
  application:
    name: multimodel
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
    ollama:
      chat:
        options:
          model: "llama3.2:1b"
    chat:
      client:
        enabled: false #Disabilita la configurazione automatica del bean ChatClient perché vogliamo configurare più di un bean ChatClient specifici per diversi LLM model.

logging:
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"
